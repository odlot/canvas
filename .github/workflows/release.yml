# Publishes the extension to the Visual Studio Marketplace when a version tag is pushed:
#
#   npm version patch          # bumps package.json + creates tag vX.Y.Z
#   git push --follow-tags
#
# Authenticates with OpenID Connect (trusted publishing), so no token secret is needed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx @vscode/vsce publish --oidc
