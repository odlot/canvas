# Publishes the extension to the Visual Studio Marketplace when a version tag is pushed.
#
#   npm version patch          # bumps package.json + creates tag vX.Y.Z
#   git push --follow-tags
#
# Required repository secret: VSCE_PAT (Marketplace token, see README "Publishing").
# Optional secret: OVSX_PAT to also publish to Open VSX (Cursor, VSCodium, Windsurf…).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != package.json $PKG"; exit 1; }

      - name: Test
        run: npm test

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package
        run: ./package.sh --skip-tests

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath canvas-*.vsix --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish canvas-*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attach .vsix to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: canvas-*.vsix
          generate_release_notes: true
